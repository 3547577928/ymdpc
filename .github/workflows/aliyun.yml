name: 构建并推送镜像到阿里云 ACR

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: crpi-ohiy6bz3uhzxjpcg.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: ymjx/ymdpc

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 提取版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.name }}-${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max