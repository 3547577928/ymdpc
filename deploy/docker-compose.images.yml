services:
  backend:
    image: quietsignal-backend:latest
    restart: unless-stopped
    environment:
      GIN_MODE: release
      PORT: 8080
      DATABASE_PATH: /data/quietsig.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-3547577928@qq.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-3547577928@qq.com}
      MAGIC_LINK_TTL: ${MAGIC_LINK_TTL:-15m}
    volumes:
      - sqlite_data:/data

  frontend:
    image: quietsignal-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  sqlite_data:
